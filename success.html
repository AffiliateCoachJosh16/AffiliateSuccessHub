<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Successful | Affiliate Success Hub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f3ff;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
        }

        .success {
            font-size: 55px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .message {
            color: #666;
            line-height: 1.6;
        }

        .details {
            margin-top: 25px;
            padding: 20px;
            background: #f1eaff;
            border-radius: 12px;
            text-align: left;
        }

        .details p {
            margin: 10px 0;
        }

        .payment-button {
            display: block;
            margin-top: 25px;
            padding: 15px;
            background: #6a00ff;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="success">🎉</div>

    <h1>Registration Successful!</h1>

    <p class="message">
        Congratulations! Your registration has been received successfully.
    </p>

    <div class="details">

        <p>
            <strong>Name:</strong>
            <span id="studentName"></span>
        </p>

        <p>
            <strong>WhatsApp:</strong>
            <span id="studentPhone"></span>
        </p>

        <p>
            <strong>Selected Skill:</strong>
            <span id="studentSkill"></span>
        </p>

        <p>
            <strong>Course Fee:</strong>
            <span id="studentPrice"></span>
        </p>

    </div>

    <a href="payment.html" class="payment-button">
        CONTINUE TO PAYMENT
    </a>

</div>

<script>

const name = localStorage.getItem("studentName") || "Student";
const phone = localStorage.getItem("studentPhone") || "";
const skill = localStorage.getItem("studentSkill") || "Not selected";
const price = localStorage.getItem("studentPrice") || "";

document.getElementById("studentName").textContent = name;
document.getElementById("studentPhone").textContent = phone;
document.getElementById("studentSkill").textContent = skill;
document.getElementById("studentPrice").textContent = price;

</script>

</body>
</html>
